[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apos"
version = "1.2.0"
description = "AI Project Operating System local orchestration runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
apos = "apos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
